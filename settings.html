<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="icon" type="image/png" href="./gaming_theme_cards/puzzle.svg" />
  </head>

  <body>
    <main class="settings">
      <div class="settings__controls">
        <header class="settings__header">
          <h2>Settings</h2>
        </header>
        <fieldset class="settings__group settings__theme-group">
          <legend class="settings__title">
            <img src="./palette.svg" alt="" />
            Game themes
          </legend>

          <label class="settings__option settings__theme-option">
            <input
              class="settings__radio"
              type="radio"
              name="theme"
              value="Code vibes theme"
              checked
            />
            Code vibes theme
          </label>

          <label class="settings__option settings__theme-option">
            <input
              class="settings__radio"
              type="radio"
              name="theme"
              value="Gaming theme"
            />
            Gaming theme
          </label>
        </fieldset>

        <fieldset class="settings__group settings__player-choice">
          <legend class="settings__title">
            <img src="./figur.svg" alt="" />
            Choose player
          </legend>

          <label class="settings__option">
            <input
              class="settings__radio"
              type="radio"
              name="player"
              value="Blue"
            />
            Blue
          </label>

          <label class="settings__option">
            <input
              class="settings__radio"
              type="radio"
              name="player"
              value="Orange"
            />
            Orange
          </label>
        </fieldset>

        <fieldset class="settings__group settings__board-size">
          <legend class="settings__title">
            <img src="./board.svg" alt="" />
            Board size
          </legend>

          <label class="settings__option">
            <input
              class="settings__radio"
              type="radio"
              name="board-size"
              value="16"
            />
            16 cards
          </label>

          <label class="settings__option">
            <input
              class="settings__radio"
              type="radio"
              name="board-size"
              value="24"
            />
            24 cards
          </label>

          <label class="settings__option">
            <input
              class="settings__radio"
              type="radio"
              name="board-size"
              value="36"
            />
            36 cards
          </label>
        </fieldset>
      </div>
      <div class="settings__preview">
        <img class="settings__theme-image" src="./Theme_Visual_1.png" alt="" />

        <div class="settings__theme-options">
          <p class="settings__selected-theme">Game theme</p>

          <div class="settings__divider"></div >

          <p class="settings__selected-player">Player</p>

          <div class="settings__divider"></div>

          <p class="settings__selected-board-size">Board size</p>
          <button class="start-button" type="button">
            <img src="./smart_display.svg" alt="" />
            <span>Start</span>
          </button>
        </div>
      </div>
    </main>

    <script type="module" src="./src/settings/settings.ts"></script>
  </body>
</html>
