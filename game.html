<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link
      rel="icon"
      type="image/png"
      href="./gaming_theme_cards/puzzle.svg"
    />
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <div class="game__players">
          <div class="game__player">
            <img
              id="gaming-theme-blue-player-icon"
              src="./frame_blue.svg"
              alt="Blue player"
            />
            <span>Blue</span>
            <span id="blue-score">0</span>
          </div>

          <div class="game__player">
            <img
              id="gaming-theme-orange-player-icon"
              src="./frame_orange.svg"
              alt="Orange player"
            />
            <span>Orange</span>
            <span id="orange-score">0</span>
          </div>
        </div>

        <div class="game__current-player">
          <span>Current player:</span>
          <img id="current-player-icon" src="./frame_blue.svg" alt="" />
        </div>

        <button class="game__exit">
          <img src="./move_item.svg" alt="" />
          <span>Exit game</span>
        </button>
      </header>
      <div class="game__board"></div>
      <section class="game__game-over">
        <h1>Game Over</h1>

        <h2>Final Score</h2>

        <div class="game__players">
          <div class="game__player">
            <img src="./frame_blue.svg" alt="" />
            <span>Blue</span>
            <span id="final-blue-score">0</span>
          </div>

          <div class="game__player">
            <img src="./frame_orange.svg" alt="" />
            <span>Orange</span>
            <span id="final-orange-score">0</span>
          </div>
        </div>
      </section>
      <div class="game__quit-modal">
        <div class="game__quit-modal-content">
          <h2>Are you sure you want to quit the game?</h2>

          <div class="game__quit-modal-buttons">
            <button class="game__quit-back" type="button">Back to game</button>

            <button class="game__quit-confirm" type="button">Exit game</button>
          </div>
        </div>
      </div>
      <section class="game__next-screen">
        <img src="./confetti.png" alt="" class="game__confetti" />
        <h2 id="winner-title">The winner is</h2>

        <p id="winner-player" class="orange">Orange player</p>

        <img id="winner-player-icon" src="" alt="" />

        <a href="./settings.html" class="game__back-to-start">
          Back to start
        </a>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
